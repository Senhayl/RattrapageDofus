# Vérifie que le site se construit à chaque pull request et sur main.
name: Build

on:
  pull_request:
  push:
    branches: [main]

# Lecture seule : ce job ne fait que construire le site.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Le comparateur Python se charge
        run: python3 -c "import sys; sys.path.insert(0, 'scripts'); import diff_spells, build_site_data, check_new_version"
